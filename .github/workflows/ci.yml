name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Required so we can push README updates, attach release assets, and deploy Pages
permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

jobs:
  # Runs on every push/PR: compile + eunit tests
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          rebar3-version: "3.27.0"

      - name: Run tests with coverage
        run: rebar3 as test eunit --cover

      - name: Generate coverage report
        run: |
          set -o pipefail
          rebar3 as test cover --verbose | tee cover_output.txt

      - name: Upload coverage report for Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/test/cover

      # Gives reviewers coverage visibility on the PR itself, without
      # touching README.md (which only updates on merge to main — a PR
      # comment is the right place for in-review, non-final numbers, and
      # avoids needing write access to a possibly-forked PR branch).
      - name: Post coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('cover_output.txt', 'utf8').split('\n');
            const rows = [];
            let total = null;
            for (const line of lines) {
              const m = line.match(/([\w_]+)\s*[:|]\s*(\d+)%/);
              if (!m) continue;
              const name = m[1], pct = parseInt(m[2], 10);
              if (name.toLowerCase() === 'total') total = pct;
              else rows.push([name, pct]);
            }
            const icon = (pct) => pct >= 80 ? '✅' : pct >= 50 ? '⚠️' : '❌';
            rows.sort((a, b) => b[1] - a[1]);
            let body = `### 🧪 Test Coverage — Overall: ${total !== null ? total : '?'}%\n\n`;
            body += '| Module | Coverage |\n|---|---|\n';
            for (const [name, pct] of rows) {
              body += `| ${icon(pct)} ${name} | ${pct}% |\n`;
            }
            const marker = '<!-- pr-coverage-comment -->';
            body = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Only updates README on actual pushes to main (not PRs, not tags) —
      # avoids fighting over a shared coverage number across branches.
      - name: Update README coverage section
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          python3 - <<'PYEOF'
          import re, os

          # GITHUB_REPOSITORY is always auto-provided as "owner/repo" — more
          # reliable than building the URL via the env: block's expression interpolation
          # in the env: block, which was evaluating empty for unclear reasons.
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          owner, _, name = repo.partition("/")
          pages_url = f"https://{owner}.github.io/{name}/"
          with open("cover_output.txt") as f:
              lines = f.readlines()

          # rebar3 cover --verbose prints "<module>  : NN%" lines per module,
          # plus a final total. Best-effort parse — adjust regex if rebar3's
          # output format changes.
          rows = []
          total = None
          for line in lines:
              m = re.search(r"([\w_]+)\s*[:|]\s*(\d+)%", line)
              if not m:
                  continue
              name, pct = m.group(1), int(m.group(2))
              if name.lower() == "total":
                  total = pct
              else:
                  rows.append((name, pct))

          def icon(pct):
              if pct >= 80: return "✅"
              if pct >= 50: return "⚠️"
              return "❌"

          # Best-effort translations of the coverage block's headings — not
          # reviewed by native speakers, worth a sanity check before relying
          # on them for anything customer-facing.
          i18n = {
              "README.md":    {"heading": "Test Coverage", "overall": "Overall", "link": "View interactive line-by-line coverage report", "module": "Module", "coverage": "Coverage", "rtl": False, "arabic_digits": False},
              "README.ja.md": {"heading": "テストカバレッジ", "overall": "合計", "link": "インタラクティブなカバレッジレポートを見る", "module": "モジュール", "coverage": "カバレッジ", "rtl": False, "arabic_digits": False},
              "README.zh.md": {"heading": "测试覆盖率", "overall": "总计", "link": "查看交互式逐行覆盖率报告", "module": "模块", "coverage": "覆盖率", "rtl": False, "arabic_digits": False},
              "README.he.md": {"heading": "כיסוי בדיקות", "overall": "סה\"כ", "link": "צפה בדוח כיסוי אינטראקטיבי", "module": "מודול", "coverage": "כיסוי", "rtl": True, "arabic_digits": False},
              "README.ar.md": {"heading": "تغطية الاختبار", "overall": "الإجمالي", "link": "عرض تقرير التغطية التفاعلي", "module": "الوحدة", "coverage": "التغطية", "rtl": True, "arabic_digits": True},
              "README.fr.md": {"heading": "Couverture des tests", "overall": "Total", "link": "Voir le rapport de couverture interactif ligne par ligne", "module": "Module", "coverage": "Couverture", "rtl": False, "arabic_digits": False},
              "README.de.md": {"heading": "Testabdeckung", "overall": "Gesamt", "link": "Interaktiven zeilenweisen Abdeckungsbericht anzeigen", "module": "Modul", "coverage": "Abdeckung", "rtl": False, "arabic_digits": False},
              "README.no.md": {"heading": "Testdekning", "overall": "Totalt", "link": "Vis interaktiv linje-for-linje dekningsrapport", "module": "Modul", "coverage": "Dekning", "rtl": False, "arabic_digits": False},
              "README.sv.md": {"heading": "Testtäckning", "overall": "Totalt", "link": "Visa interaktiv rad-för-rad-täckningsrapport", "module": "Modul", "coverage": "Täckning", "rtl": False, "arabic_digits": False},
              "README.tr.md": {"heading": "Test Kapsamı", "overall": "Toplam", "link": "Etkileşimli satır satır kapsam raporunu görüntüle", "module": "Modül", "coverage": "Kapsam", "rtl": False, "arabic_digits": False},
              "README.ms.md": {"heading": "Liputan Ujian", "overall": "Jumlah", "link": "Lihat laporan liputan interaktif baris demi baris", "module": "Modul", "coverage": "Liputan", "rtl": False, "arabic_digits": False},
              "README.id.md": {"heading": "Cakupan Pengujian", "overall": "Total", "link": "Lihat laporan cakupan interaktif baris demi baris", "module": "Modul", "coverage": "Cakupan", "rtl": False, "arabic_digits": False},
              "README.es.md": {"heading": "Cobertura de Pruebas", "overall": "Total", "link": "Ver informe de cobertura interactivo línea por línea", "module": "Módulo", "coverage": "Cobertura", "rtl": False, "arabic_digits": False},
          }

          # Eastern Arabic-Indic digits. Note: numeral convention varies by
          # region — Gulf/Egypt commonly use these, while Maghreb countries
          # (Morocco, Algeria, Tunisia) often use Western digits instead.
          # This is a judgment call, not a universal rule.
          _ARABIC_DIGITS = str.maketrans("0123456789", "٠١٢٣٤٥٦٧٨٩")

          def localize_digits(s, use_arabic):
              return s.translate(_ARABIC_DIGITS) if use_arabic else s

          def build_block(labels):
              pct_str = localize_digits(str(total) if total is not None else "?", labels["arabic_digits"])
              lines_out = ["<!-- COVERAGE-START -->"]
              lines_out.append(f"### 🧪 {labels['heading']} — {labels['overall']}: {pct_str}%\n")
              lines_out.append(f"[📊 {labels['link']}]({pages_url})\n")

              if labels["rtl"]:
                  # Markdown tables always render column order left-to-right
                  # regardless of text direction, so RTL languages get a raw
                  # HTML table with dir="rtl" instead — the only way GitHub's
                  # renderer actually flows a table right-to-left.
                  lines_out.append('<table dir="rtl" align="right">')
                  lines_out.append(f"<tr><th>{labels['coverage']}</th><th>{labels['module']}</th></tr>")
                  for name, pct in sorted(rows, key=lambda r: -r[1]):
                      pct_disp = localize_digits(str(pct), labels["arabic_digits"])
                      lines_out.append(f"<tr><td>{icon(pct)} {pct_disp}%</td><td>{name}</td></tr>")
                  lines_out.append("</table>")
              else:
                  lines_out.append(f"| {labels['module']} | {labels['coverage']} |")
                  lines_out.append("|---|---|")
                  for name, pct in sorted(rows, key=lambda r: -r[1]):
                      lines_out.append(f"| {icon(pct)} {name} | {pct}% |")

              lines_out.append("<!-- COVERAGE-END -->")
              return "\n".join(lines_out)

          # Apply to every README variant that exists (English + any
          # translations) so coverage stays in sync across all of them.
          import os
          readme_files = [f for f in
                          ["README.md", "README.ja.md", "README.zh.md", "README.he.md", "README.ar.md",
                           "README.fr.md", "README.de.md", "README.no.md", "README.sv.md", "README.tr.md",
                           "README.ms.md", "README.id.md", "README.es.md"]
                          if os.path.exists(f)]
          for readme_file in readme_files:
              labels = i18n.get(readme_file, i18n["README.md"])
              new_block = build_block(labels)
              with open(readme_file) as f:
                  content = f.read()
              content = re.sub(
                  r"<!-- COVERAGE-START -->.*?<!-- COVERAGE-END -->",
                  new_block, content, flags=re.DOTALL
              )
              with open(readme_file, "w") as f:
                  f.write(content)
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED_FILES=""
          for f in "README.md" "README.ja.md" "README.zh.md" "README.he.md" "README.ar.md" \
                   "README.fr.md" "README.de.md" "README.no.md" "README.sv.md" "README.tr.md" \
                   "README.ms.md" "README.id.md" "README.es.md"; do
            if [ -f "$f" ]; then
              git add "$f"
              if ! git diff --cached --quiet -- "$f"; then
                CHANGED_FILES="${CHANGED_FILES}${f}\n"
              fi
            fi
          done
          if [ -n "$CHANGED_FILES" ]; then
            git commit -m "docs: update coverage badges [skip ci]" -m "$(printf '%b' "Updated:\n${CHANGED_FILES}")"
          fi
          git push


  # Runs the full eds workflow (init/migrate/verify/rollback/locking)
  # against a REAL Postgres instance — no mocks. See
  # test/erl_data_shift_integration_SUITE.erl. Uses Common Test
  # specifically so this never runs as part of `rebar3 eunit`.
  integration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          rebar3-version: "3.27.0"

      - name: Run integration tests
        run: rebar3 ct

  # Deploys the coverage HTML report uploaded above to GitHub Pages.
  deploy-pages:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs only on version tags (e.g. v0.1.0): builds prod release per OS and
  # attaches the tarball to a GitHub Release.
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: eds-linux-x86_64
          - os: macos-latest
            artifact_name: eds-macos-arm64
          - os: windows-latest
            artifact_name: eds-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # setup-beam provides a proper OTP build with crypto/OpenSSL on both
      # Linux and macOS runners, so no manual kerl/OpenSSL bootstrap needed in CI.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.1.2"
          rebar3-version: "3.27.0"

      - name: Build prod release
        run: rebar3 as prod release

      - name: Package self-extracting single-file binary (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION=$(grep -o '{release, {erl_data_shift, "[^"]*"' rebar.config | sed 's/.*"\(.*\)"/\1/')
          OUT_FILE="_build/prod/bin/${{ matrix.artifact_name }}"
          TARBALL="_build/prod/erl_data_shift-release.tar.gz"
          mkdir -p "_build/prod/bin"
          tar -C "_build/prod/rel" -czf "$TARBALL" erl_data_shift
          cat > "$OUT_FILE" <<STUB
          #!/usr/bin/env bash
          set -e
          CACHE_DIR="\${HOME}/.cache/erl_data_shift/${VERSION}"
          if [ ! -x "\${CACHE_DIR}/bin/erl_data_shift" ]; then
              mkdir -p "\${CACHE_DIR}"
              ARCHIVE_LINE=\$(awk '/__ARCHIVE_BELOW__\$/{print NR + 1; exit 0;}' "\$0")
              tail -n +"\${ARCHIVE_LINE}" "\$0" | tar -xz -C "\${CACHE_DIR}" --strip-components=1
          fi
          export EDS_ORIGINAL_CWD="\$(pwd)"
          ARGS=("\$@")
          case "\${ARGS[0]:-}" in
              --version|-v) ARGS[0]="version" ;;
              --help|-h) ARGS[0]="help" ;;
          esac
          set +e
          "\${CACHE_DIR}/bin/erl_data_shift" foreground "\${ARGS[@]}" \
              | grep -vE '^Exec: ' \
              | grep -vE '^Root: ' \
              | grep -vFx "\${CACHE_DIR}"
          exit "\${PIPESTATUS[0]}"
          exit 0
          __ARCHIVE_BELOW__
          STUB
          cat "$TARBALL" >> "$OUT_FILE"
          chmod +x "$OUT_FILE"
          rm -f "$TARBALL"

      # Windows has no bash self-extracting-stub equivalent, so this ships
      # as a .zip instead (standard for Windows CLI tools). See
      # scripts/release/build_windows.ps1 for the shared packaging logic.
      - name: Package release (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/release/build_windows.ps1

      - name: Compute checksum (macOS/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p checksums
          shasum -a 256 "_build/prod/bin/${{ matrix.artifact_name }}" | awk '{print $1}' > "checksums/${{ matrix.artifact_name }}.sha256"

      - name: Compute checksum (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path checksums | Out-Null
          $hash = (Get-FileHash "_build/prod/bin/${{ matrix.artifact_name }}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "checksums/${{ matrix.artifact_name }}.sha256" -Value $hash -NoNewline

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksum-${{ matrix.artifact_name }}
          path: checksums/${{ matrix.artifact_name }}.sha256

      - name: Upload to GitHub Release (macOS/Linux)
        if: matrix.os != 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: _build/prod/bin/${{ matrix.artifact_name }}
          overwrite: true

      - name: Upload to GitHub Release (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: _build/prod/bin/${{ matrix.artifact_name }}.zip
          overwrite: true

  # Runs once after both release legs finish: aggregates checksums from
  # both OS builds and updates the README's CHECKSUMS section in one commit.
  update-readme-checksums:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          path: checksums
          merge-multiple: true

      - name: Update README checksums section
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          CHECKSUM_LINES=""
          for f in checksums/*.sha256; do
            NAME=$(basename "$f" .sha256)
            SUM=$(cat "$f")
            CHECKSUM_LINES="${CHECKSUM_LINES}${SUM}  ${NAME}"$'\n'
          done
          python3 - "$TAG" "$CHECKSUM_LINES" <<'PYEOF'
          import re, sys, os
          tag = sys.argv[1]
          checksum_lines = sys.argv[2]

          # Best-effort translations of the checksums heading — not reviewed
          # by native speakers, worth a sanity check before relying on them.
          i18n = {
              "README.md":    f"Release {tag} SHA256 Checksums",
              "README.ja.md": f"リリース {tag} の SHA256 チェックサム",
              "README.zh.md": f"发布 {tag} 的 SHA256 校验和",
              "README.he.md": f"סכומי ביקורת SHA256 עבור גרסה {tag}",
              "README.ar.md": f"المجاميع الاختبارية SHA256 لإصدار {tag}",
              "README.fr.md": f"Sommes de contrôle SHA256 de la version {tag}",
              "README.de.md": f"SHA256-Prüfsummen für Release {tag}",
              "README.no.md": f"SHA256-sjekksummer for utgivelse {tag}",
              "README.sv.md": f"SHA256-kontrollsummor för utgåva {tag}",
              "README.tr.md": f"{tag} Sürümü SHA256 Sağlama Toplamları",
              "README.ms.md": f"Jumlah Semak SHA256 untuk Keluaran {tag}",
              "README.id.md": f"Checksum SHA256 untuk Rilis {tag}",
              "README.es.md": f"Sumas de comprobación SHA256 de la versión {tag}",
          }

          def build_block(heading):
              return f"<!-- CHECKSUMS-START -->\n### 🔒 {heading}\n\n```\n{checksum_lines}```\n<!-- CHECKSUMS-END -->"

          # Apply to every README variant that exists (English + any
          # translations) so checksums stay in sync across all of them.
          readme_files = [f for f in
                          ["README.md", "README.ja.md", "README.zh.md", "README.he.md", "README.ar.md",
                           "README.fr.md", "README.de.md", "README.no.md", "README.sv.md", "README.tr.md",
                           "README.ms.md", "README.id.md", "README.es.md"]
                          if os.path.exists(f)]
          for readme_file in readme_files:
              heading = i18n.get(readme_file, i18n["README.md"])
              block = build_block(heading)
              with open(readme_file) as f:
                  content = f.read()
              content = re.sub(
                  r"<!-- CHECKSUMS-START -->.*?<!-- CHECKSUMS-END -->",
                  block, content, flags=re.DOTALL
              )
              with open(readme_file, "w") as f:
                  f.write(content)
          PYEOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          CHANGED_FILES=""
          for f in "README.md" "README.ja.md" "README.zh.md" "README.he.md" "README.ar.md" \
                   "README.fr.md" "README.de.md" "README.no.md" "README.sv.md" "README.tr.md" \
                   "README.ms.md" "README.id.md" "README.es.md"; do
            if [ -f "$f" ]; then
              git add "$f"
              if ! git diff --cached --quiet -- "$f"; then
                CHANGED_FILES="${CHANGED_FILES}${f}\n"
              fi
            fi
          done
          if [ -n "$CHANGED_FILES" ]; then
            git commit -m "docs: update checksums for ${TAG} [skip ci]" -m "$(printf '%b' "Updated:\n${CHANGED_FILES}")"
          fi
          git push origin HEAD:main

  # Updates the Homebrew tap (a separate repo: OWNER/homebrew-eds) with the
  # new version, download URLs, and checksums for this release. Requires a
  # HOMEBREW_TAP_TOKEN secret: a Personal Access Token with write access to
  # that repo (GITHUB_TOKEN only has access to *this* repo, not others).
  update-homebrew-tap:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: seyed/homebrew-eds
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          pattern: checksum-*
          path: checksums
          merge-multiple: true

      - name: Update formula
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          MACOS_SHA=$(cat checksums/eds-macos-arm64.sha256)
          LINUX_SHA=$(cat checksums/eds-linux-x86_64.sha256)

          sed -i \
            -e "s/version \".*\"/version \"${VERSION}\"/" \
            -e "s|releases/download/v[^/]*/eds-macos-arm64|releases/download/${TAG}/eds-macos-arm64|" \
            -e "s|releases/download/v[^/]*/eds-linux-x86_64|releases/download/${TAG}/eds-linux-x86_64|" \
            -e "0,/sha256 \".*\"/s//sha256 \"${MACOS_SHA}\"/" \
            Formula/eds.rb

          # Second sha256 occurrence (Linux) — the first sed only touches the first match.
          python3 - "$LINUX_SHA" <<'PYEOF'
          import re, sys
          linux_sha = sys.argv[1]
          with open("Formula/eds.rb") as f:
              content = f.read()
          matches = list(re.finditer(r'sha256 "[^"]*"', content))
          if len(matches) >= 2:
              start, end = matches[1].span()
              content = content[:start] + f'sha256 "{linux_sha}"' + content[end:]
          with open("Formula/eds.rb", "w") as f:
              f.write(content)
          PYEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/eds.rb
          git diff --cached --quiet || git commit -m "eds ${VERSION}"
          git push
